COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Добро пожаловать в Joomla</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Основные обновления</h2><div class=\"col-12 mb-3\"><h3>Редактирование элементов контента</h3><ul><li>Добавление изображений и медиа стало проще благодаря обновленному диалоговому окну, которое открывает медиа-менеджер Joomla, а новая кнопка \"Подробнее\" обеспечивает быстрый способ вставки тега в текст материала.</li><li>Для изображений вводного и полного текста теперь доступны отдельные CSS-классы: одни - непосредственно для изображений, другие - для окружающих их фигур.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Многоуровневые меню в шаблоне Cassiopeia\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Шаблон Cassiopeia</h3><ul><li>Меню в шаблоне Cassiopeia теперь поддерживает более одного подуровня для выпадающего или сворачиваемого макетов.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Модули и обновление расширений</h3><ul class=\"mb-3\"><li>В модуле <strong>Вход на сайт</strong> ссылки \"Забыли пароль?\" и \"Забыли логин?\" теперь регулируются параметрами без переопределения шаблона (по умолчанию параметры включены).</li><li>Разработчики могут пометить новую версию расширения одним из уровней обновления безопасности: нет, низкий, средний, высокий, критический. Такие обновления расширений визуально выделяются на странице <strong>Система &#8594; Обновление &#8594; Расширения</strong>, а также отображаются в модуле <strong>Панель быстрого доступа</strong> на главной странице панели управления.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Уровень обновления безопасности для расширений\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Что нового в Joomla 6.2"
